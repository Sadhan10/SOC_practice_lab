<!DOCTYPE html>
<html>
<head>
    <title>Operation Black Falcon | Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">

<div class="login-box">
    <h1>Operation Black Falcon</h1>
    <p class="subtitle">SOC Investigation CTF Platform</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Enter SOC Console</button>
    </form>

    <div class="login-credentials">
        <span>Training Account</span>
        <strong>Username: analyst</strong>
        <strong>Password: Analyst@123</strong>
    </div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
